# Development: docker compose up -d (Postgres only), set NUXT_MQTT_URL in .env, npm run dev
# Local broker: add --profile broker (then NUXT_MQTT_URL=mqtt://localhost:1883)
# Full stack:  docker compose --profile app up --build (NUXT_MQTT_URL from .env, or --profile broker)
services:
  postgres:
    # Plain PostgreSQL also works, e.g. postgres:18 (NUXT_TIMESCALE_MODE=auto falls back)
    image: timescale/timescaledb:latest-pg18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mqtt_logger
    volumes:
      - postgres-data:/var/lib/postgresql
    ports:
      - 5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mqtt_logger"]
      interval: 5s
      retries: 10

  mosquitto:
    image: eclipse-mosquitto:2
    profiles: [broker]
    volumes:
      - ./docker/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    ports:
      - 1883:1883

  mqtt-logger:
    build: .
    profiles: [app]
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/mqtt_logger
      NUXT_MQTT_URL: ${NUXT_MQTT_URL:-mqtt://mosquitto:1883}
      NUXT_MQTT_USERNAME: ${NUXT_MQTT_USERNAME:-}
      NUXT_MQTT_PASSWORD: ${NUXT_MQTT_PASSWORD:-}
      NUXT_TIMESCALE_COMPRESS_AFTER: 7 days
      NUXT_SESSION_PASSWORD: ${NUXT_SESSION_PASSWORD:-}
      NUXT_OAUTH_OIDC_CLIENT_ID: ${NUXT_OAUTH_OIDC_CLIENT_ID:-}
      NUXT_OAUTH_OIDC_CLIENT_SECRET: ${NUXT_OAUTH_OIDC_CLIENT_SECRET:-}
      NUXT_OAUTH_OIDC_OPENID_CONFIG: ${NUXT_OAUTH_OIDC_OPENID_CONFIG:-}
      NUXT_OAUTH_OIDC_REDIRECT_URL: ${NUXT_OAUTH_OIDC_REDIRECT_URL:-}
      NUXT_OIDC_AUDIENCE: ${NUXT_OIDC_AUDIENCE:-}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - 3000:3000

volumes:
  postgres-data:
